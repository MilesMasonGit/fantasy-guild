[package]
name = "app"
version = "0.5.1"
# ⚠️ Customer-facing: this string is what the Windows installer shows (CR2-187).
# It used to end "…and defending against invasions" — invasions are a retired
# concept and the installer was advertising a game that no longer exists.
description = "An idle game where you manage a guild of heroes, laying out Tokens on a playmat to gather materials, craft goods and grow the guild."
authors = ["Miles Mason"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
